name: Verify PodVigil Modal

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  quality:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ci.txt
      - run: python tools/ci.py audit
      - run: python -m ruff check --select E9,F63,F7,F82 src tests tools examples
      - run: python tools/format_files.py --check --python-only
      - run: python tools/check_workflows.py
      - run: python tools/check_docs.py

  tests:
    if: github.server_url == 'https://github.com'
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }}, ${{ matrix.dependencies }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
            dependencies: none
          - os: ubuntu-24.04
            python: '3.10'
            dependencies: lock
          - os: ubuntu-24.04
            python: '3.12'
            dependencies: lock
          - os: ubuntu-24.04
            python: '3.14'
            dependencies: lock
          - os: windows-2025
            python: '3.12'
            dependencies: lock
          - os: macos-26
            python: '3.12'
            dependencies: lock
          - os: macos-26-intel
            python: '3.12'
            dependencies: lock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Create the project environment
        run: python -m venv .venv
      - name: Unix locked dependencies
        if: runner.os != 'Windows' && matrix.dependencies == 'lock'
        run: .venv/bin/python -m pip install -r requirements.lock.txt
      - name: Windows locked dependencies
        if: runner.os == 'Windows'
        run: .venv/Scripts/python.exe -m pip install -r requirements.lock.txt
      - name: Linux offline tests and supervisor runtime
        if: runner.os == 'Linux'
        run: .venv/bin/python -B tools/ci.py test
      - name: macOS offline tests and detached worker
        if: runner.os == 'macOS'
        env:
          TMPDIR: ${{ runner.temp }}
        run: .venv/bin/python -B tools/ci.py test
      - name: Windows offline tests and detached worker
        if: runner.os == 'Windows'
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: .venv/Scripts/python.exe -B tools/ci.py test
      - name: macOS workflow tooling
        if: runner.os == 'macOS'
        run: python tools/check_workflows.py
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.dependencies }}
          path: output/ci/
          if-no-files-found: error
          retention-days: 14

  containers:
    if: github.server_url == 'https://github.com'
    name: Linux container (init=${{ matrix.init }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        init: [false, true]
    env:
      REVIEW_IMAGE: python:3.13.7-slim-bookworm@sha256:adafcc17694d715c905b4c7bebd96907a1fd5cf183395f0ebc4d3428bd22d92d
      USE_INIT: ${{ matrix.init }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the pinned test image
        run: docker pull "$REVIEW_IMAGE"
      - name: Test archived source with networking disabled
        shell: bash
        run: |
          mkdir -p output/ci
          options=()
          if [ "$USE_INIT" = true ]; then options+=(--init); fi
          git archive --format=tar HEAD | docker run --rm -i --pull=never --network none \
            "${options[@]}" --workdir /work --entrypoint sh "$REVIEW_IMAGE" -c '
              tar -xf - || exit
              python -B tools/ci.py test
              result=$?
              cat output/ci/all-tests.log
              exit "$result"
            ' 2>&1 | tee "output/ci/container-init-$USE_INIT.log"
      - name: Preserve container test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-tests-init-${{ matrix.init }}
          path: output/ci/
          if-no-files-found: error
          retention-days: 14

  distributions:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m build --no-isolation
      - run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - name: Test the installed CLI without SDK credentials
        run: python -B tools/ci.py smoke
      - name: Record distribution checksums
        run: |
          cd dist
          sha256sum -- *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  macos-packages:
    if: github.server_url == 'https://github.com'
    name: Installed wheel (${{ matrix.os }})
    needs: distributions
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions-${{ github.sha }}
          path: dist/
      - name: Verify the downloaded distributions
        working-directory: dist
        run: shasum -a 256 --check SHA256SUMS
      - name: Test the same wheel outside the checkout without the SDK
        env:
          TMPDIR: ${{ runner.temp }}
        shell: bash
        run: |
          mkdir -p output/ci
          python -B tools/ci.py smoke 2>&1 | tee output/ci/wheel-smoke.log
      - name: Preserve package test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-smoke-${{ matrix.os }}
          path: output/ci/
          if-no-files-found: warn
          retention-days: 14

  required:
    name: All checks passed
    if: always() && github.server_url == 'https://github.com'
    needs: [quality, tests, containers, distributions, macos-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      QUALITY: ${{ needs.quality.result }}
      TESTS: ${{ needs.tests.result }}
      CONTAINERS: ${{ needs.containers.result }}
      DISTRIBUTIONS: ${{ needs.distributions.result }}
      MACOS_PACKAGES: ${{ needs.macos-packages.result }}
    steps:
      - run: |
          test "$QUALITY" = success
          test "$TESTS" = success
          test "$CONTAINERS" = success
          test "$DISTRIBUTIONS" = success
          test "$MACOS_PACKAGES" = success
